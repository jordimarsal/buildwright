# Model registry: local and remote models in one place.
# Agents never pick a model themselves: role -> id is defined in config
# (BW_ROLE_* or the project's runtime.yaml)
models:
  # ---------------- local ----------------
  - id: local/qwen3
    label: Qwen3 8B (Ollama)
    kind: local
    base_url: http://localhost:11434/v1
    model: qwen3:8b

  - id: local/llamacpp
    label: llama.cpp server (GGUF)
    kind: local
    base_url: http://localhost:8080/v1
    model: local-model

  # ---------------- remote ----------------
  - id: remote/gpt-4o-mini
    label: GPT-4o mini
    kind: remote
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY

  - id: remote/gpt-4o
    label: GPT-4o
    kind: remote
    base_url: https://api.openai.com/v1
    model: gpt-4o
    api_key_env: OPENAI_API_KEY

  - id: remote/claude-sonnet
    label: Claude Sonnet 4.5
    kind: remote
    base_url: https://api.anthropic.com/v1
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY

  # --------- Z.ai / Zhipu (GLM) — small and cheap; coding-plan keys go to ---------
  # the /api/coding/paas/v4 base_url instead, or inference fails with error 1113
  # ("insufficient balance") even though /models lists fine.
  - id: remote/zai-glm-flash
    label: GLM-5.3-flash (Z.ai)
    kind: remote
    base_url: https://api.z.ai/api/paas/v4
    model: glm-5.3-flash
    api_key_env: ZAI_API_KEY

  # --------- via LiteLLM proxy (optional, docker-compose) ---------
  - id: litellm/gpt-4o-mini
    label: GPT-4o mini via LiteLLM
    kind: remote
    base_url: http://localhost:4000/v1
    model: gpt-4o-mini
    api_key_env: LITELLM_API_KEY
