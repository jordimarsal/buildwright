# Model registry: local and remote models in one place.
# Agents never pick a model themselves: role -> id is defined in config
# (BW_ROLE_* or the project's runtime.yaml)
#
# Optional pricing (phase 4): add `input_price` / `output_price` (USD per
# million tokens) to an entry and the loop accumulates real spend — the
# finalize retro line reports it as `retro: … · $0.0123`. Entries without
# prices simply never report cost.
models:
  # ---------------- local ----------------
  - id: local/qwen3
    label: Qwen3 8B (Ollama)
    kind: local
    base_url: http://localhost:11434/v1
    model: qwen3:8b

  - id: local/llamacpp
    label: Qwen3-4B Q4_K_M (llama.cpp CUDA, RTX 4070)
    kind: local
    base_url: http://172.25.0.1:8080/v1
    model: qwen3-4b
    context_window: 16384

  # ---------------- remote ----------------
  - id: remote/gpt-4o-mini
    label: GPT-4o mini
    kind: remote
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY

  - id: remote/gpt-4o
    label: GPT-4o
    kind: remote
    base_url: https://api.openai.com/v1
    model: gpt-4o
    api_key_env: OPENAI_API_KEY

  - id: remote/claude-sonnet
    label: Claude Sonnet 4.5
    kind: remote
    base_url: https://api.anthropic.com/v1
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY

  # --------- Z.ai / Zhipu (GLM) — coding-plan key, /api/coding/paas/v4 ---------
  # Verified: the standard /api/paas/v4 returns 429 with a coding-plan key.
  - id: remote/zai-glm-flash
    label: GLM-5.3-flash (Z.ai coding plan)
    kind: remote
    base_url: https://api.z.ai/api/coding/paas/v4
    model: glm-5.3-flash
    api_key_env: ZAI_API_KEY

  # --------- via LiteLLM proxy (optional, docker-compose) ---------
  - id: litellm/gpt-4o-mini
    label: GPT-4o mini via LiteLLM
    kind: remote
    base_url: http://localhost:4000/v1
    model: gpt-4o-mini
    api_key_env: LITELLM_API_KEY
