# Optional LiteLLM proxy: centralized routing, fallbacks and budgets.
# App code never talks to it directly: it speaks OpenAI protocol against
# http://localhost:4000/v1 (the litellm/* entry in models.yaml).
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: qwen3
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434

litellm_settings:
  # traces of EVERY call sent to Langfuse, without touching app code:
  success_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
