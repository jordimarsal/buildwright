# Proxy LiteLLM opcional: routing, fallbacks i pressupostos centralitzats.
# El codi de l'app mai no parla amb això directament: parla OpenAI-protocol
# contra http://localhost:4000/v1 (entrada litellm/* de models.yaml).
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: qwen3
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434

litellm_settings:
  # traces de TOTES les trucades a Langfuse, sense tocar codi d'app:
  success_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
